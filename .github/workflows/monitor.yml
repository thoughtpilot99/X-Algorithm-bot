name: monitor

# Daily collection + re-analysis. Weekly report on Mondays, monthly audit on the 1st.
# Requires repository secret XP_API_KEY (ThoughtPilot console). ANTHROPIC_API_KEY is optional
# (labels new posts with Claude; heuristics otherwise).
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "daily | weekly | monthly | dry-run"
        default: daily
        type: choice
        options: [daily, weekly, monthly, dry-run]
  # On-demand runs without the Actions UI: push a change to this file whose first word is the mode.
  push:
    branches: [claude/charming-hawking-pqaz1d]
    paths: [.github/run-request]

permissions:
  contents: write
  actions: read

concurrency:
  group: xaudit-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      XP_API_KEY: ${{ secrets.XP_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Resolve mode
        id: mode
        working-directory: .
        run: |
          MODE="${{ inputs.mode }}"
          if [ "${{ github.event_name }}" = "push" ]; then MODE=$(awk 'NR==1{print $1}' .github/run-request); fi
          case "$MODE" in daily|weekly|monthly|dry-run) ;; *) MODE=daily ;; esac
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Mode: $MODE (${{ github.event_name }})"

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install
        run: |
          uv sync --all-extras
          uv run playwright install --with-deps chromium

      - name: Restore state from the previous run
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: monitor.yml
          name: xaudit-state
          path: data
          workflow_conclusion: success
          search_artifacts: true
          if_no_artifact_found: warn

      - name: Sync algorithm repository
        run: uv run xaudit sync-repo --commits 20

      - name: Check console API contract
        if: steps.mode.outputs.mode != 'dry-run'
        run: uv run xaudit doctor

      # Decide from the data, not from file existence: sync-repo writes parameter history
      # into the database, so the file exists even on a fresh state.
      - name: Check stored history
        id: state
        run: echo "backfill=$(uv run --quiet xaudit status --needs-backfill)" >> "$GITHUB_OUTPUT"

      - name: Backfill (full history, 12 months)
        if: steps.state.outputs.backfill == 'true' && steps.mode.outputs.mode != 'dry-run'
        run: |
          uv run xaudit ingest --live --missing-only
          uv run xaudit status

      - name: Seed reviewed labels and rewrites (idempotent)
        run: |
          uv run xaudit import-labels --folder seed/labels
          mkdir -p ../data/labels/rewrites && cp seed/rewrites/*.json ../data/labels/rewrites/

      - name: Monitor
        run: |
          ARGS=""
          case "${{ steps.mode.outputs.mode }}" in
            dry-run) ARGS="--dry-run" ;;
            weekly)  ARGS="--weekly --peers" ;;
            monthly) ARGS="--monthly --weekly --peers" ;;
          esac
          uv run xaudit monitor $ARGS

      - name: Post Slack digest
        if: success() && env.SLACK_WEBHOOK_URL != '' && steps.mode.outputs.mode != 'dry-run'
        run: uv run xaudit notify-slack

      - name: Tell Slack the run failed
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\":warning: X audit monitoring run failed today. Logs: ${RUN_URL}\"}" \
            "$SLACK_WEBHOOK_URL" > /dev/null

      - name: Regenerate algorithm research doc
        run: uv run xaudit algo-docs

      - name: Save state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xaudit-state
          path: |
            data/xaudit.sqlite
            data/raw
            data/labels
          retention-days: 90
          if-no-files-found: warn

      - name: Commit reports (Mondays, 1st of month, or manual weekly/monthly)
        if: success() && steps.mode.outputs.mode != 'dry-run'
        working-directory: .
        run: |
          MODE="${{ steps.mode.outputs.mode }}"
          DOW=$(date -u +%u); DOM=$(date -u +%d)
          if [ "$MODE" != "weekly" ] && [ "$MODE" != "monthly" ] && [ "$DOW" != "1" ] && [ "$DOM" != "01" ]; then
            echo "Not a report day; nothing committed."; exit 0
          fi
          git config user.name "xaudit-bot"
          git config user.email "xaudit-bot@users.noreply.github.com"
          # Dashboard data (JSON only) so the snapshot page can be republished with live results.
          rm -rf dashboard-data
          (cd backend && uv run xaudit export-static --out ../dashboard-data)
          git add reports docs/algorithm-research.md dashboard-data
          if git diff --cached --quiet; then echo "No report changes."; exit 0; fi
          git commit -m "Monitoring reports $(date -u +%Y-%m-%d)"
          # Code may have been pushed while the run was collecting: replay the report commit on top.
          for i in 1 2 3; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep $((i * 5))
          done
          echo "Could not push reports after 3 attempts"; exit 1
