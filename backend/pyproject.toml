[project]
name = "xaudit"
version = "0.1.0"
description = "X Account Intelligence & Algorithm Audit System"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "networkx>=3.3",
    "anthropic>=0.40",
    "jinja2>=3.1",
    "httpx>=0.27",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
pdf = ["playwright>=1.45"]

[project.scripts]
xaudit = "xaudit.cli:app"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.8,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Long prose strings in diagnostics/report text are clearer unwrapped.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
