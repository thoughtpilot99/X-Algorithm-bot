  params: []
  status: verified
  relevance: Eligibility for the shared popular-posts list depends on being among the highest-follower accounts that posted in the last 7 days; most accounts will not qualify, so this path likely matters only for very large accounts.
  observable_proxy: follower count
  limitations: The absolute follower threshold depends on how many accounts posted in 7 days, which is not in the repo. The BigQuery table's construction is not published; the fraction can be overridden by a CLI flag.
