  anchor: query.is_topic_request()
  params: [PhoenixRetrievalTopicInferenceClusterId, TopicFilteringId, TopicFilteringOverrides, PhoenixMaxResults]
  status: verified
  relevance: Matters only on topic-filtered timeline requests; posts classified into a topic (via the 1fav_topic index, A08) may be discoverable by non-followers browsing that topic.
  observable_proxy: none — not observable from public data
  limitations: How topics are assigned to posts relies on classifiers/stores outside this source file.
- id: A11
  area: A
  title: SimClusters source constants (score floor, seed age, result caps)
  mechanism: SimclustersSource queries SimClusters ANN with cosine similarity over log-fav embeddings (MODEL_20M_145K_2020), ANN_MAX_NUM_RESULTS = 200 per seed, scanning up to 50 clusters. Results are kept only if score > POST_ANN_MIN_SCORE = 0.5, seeds must be no older than MAX_SEED_AGE (90 days), and the merged output is capped at MAX_RESULTS = 800.
  path: home-mixer/sources/simclusters_source.rs
  lines: [25, 36]
  symbol: POST_ANN_MIN_SCORE, MAX_SEED_AGE, MAX_RESULTS, MAX_SANN_CANDIDATES
  anchor: 'const POST_ANN_MIN_SCORE: f64 = 0.5;'
  params: [EnableSimclustersSource, SimclustersMaxCandidateAgeHours]
  status: verified
  relevance: 'A second out-of-network path: posts that are cluster-similar (by who favorites them) to posts the viewer engaged with can be surfaced to non-followers. Candidate age is bounded by SimclustersMaxCandidateAgeHours (default 48).'
  observable_proxy: likes (log-fav embeddings are favorite-based); post age
  limitations: The SimClusters embeddings and ANN service are in simclusters/ (Scala) and their training data is not published. The OONNsfwSimclustersFilter later removes SimClusters posts from adult-flagged authors the viewer does not follow.
- id: A12
  area: A
  title: SimClusters seeds come from the viewer's recent engagements
  mechanism: Seeds are the post ids from the viewer's explicit and implicit engagement signals, sorted by engaged_at_ms (most recent first) and deduplicated; seeds older than MAX_SEED_AGE are dropped. Each seed's ANN results are filtered by POST_ANN_MIN_SCORE, limited to MAX_SANN_CANDIDATES / number_of_seeds per seed, round-robin interleaved, and truncated to 800.
  path: home-mixer/sources/simclusters_source.rs
  lines: [222, 252]
  symbol: SimclustersSource::source, post_signal_ids
  anchor: let max_per_query = (MAX_SANN_CANDIDATES / signal_ids.len()).max(1);
  params: [SimclustersMaxCandidateAgeHours, EngagementSignalsMaxPerType]
  status: verified
  relevance: If viewers who engage with posts similar to an account's posts are numerous, the account's posts may be pulled in as similar candidates; engagement on an account's own posts also becomes a seed for that engager's future SimClusters retrieval.
  observable_proxy: likes, reposts, replies, bookmarks on posts (as seeds for engagers)
  limitations: Per-type signal caps (EngagementSignalsMaxPerType, default 15) and the upstream engagement stores (twistly) are outside this file; caching (pod and shared caches, 600s pod TTL) can delay changes.
- id: A13
  area: A
  title: Explicit engagement signal types used as retrieval seeds
  mechanism: ExplicitEngagementSignalsQueryHydrator splits the viewer's recent engaged tweets into Favorite, Retweet, Reply, Bookmark, Share and OriginalTweet (the viewer's own posts) signals, keeping EngagementSignalsMaxPerType per type. The implicit hydrator adds PhotoExpand, VideoQualityView and ImmersiveVideoQualityView. These feed SimClusters and SID seeds via post_signal_ids.
  path: home-mixer/query_hydrators/explicit_engagement_signals_query_hydrator.rs
  lines: [68, 96]
  symbol: split_by_type
  anchor: EngagementMetadata::BookmarkMetadata(m) => {
  params: [EnableExplicitEngagementSignals, EnableImplicitEngagementSignals, EngagementSignalsMaxPerType]
  status: verified
  relevance: Bookmarks and shares are seed signals here even though bookmarks have no weight in the ranking value model; a viewer bookmarking a post may plausibly lead to similar posts being retrieved for that viewer later.
  observable_proxy: bookmarks, likes, reposts, replies (counts are public; who engaged mostly is not)
  limitations: Signals are capped per type and fetched with a 300ms timeout (HYDRATE_TIMEOUT, line 16); the store's retention is unknown.
- id: A14
