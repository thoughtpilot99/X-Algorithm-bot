  anchor: 'half_life_hours: 8.0,'
  params: [EnablePopularPostsSource, PopularPostsMaxResults]
  status: verified
  relevance: Only authors in the popular-authors list (A15) feed this list, so for most accounts it is not a discovery path; for eligible authors, posts with high views relative to age rank higher.
  observable_proxy: views and post age (views per hour since posting)
  limitations: home-mixer/main.rs exposes CLI flags for per_author, budget and half_life (defaults 5, 500, 8.0); actual job flags in production are not shown. PopularPostsSource serves up to PopularPostsMaxResults (default 500) and is shared across viewers.
- id: A15
