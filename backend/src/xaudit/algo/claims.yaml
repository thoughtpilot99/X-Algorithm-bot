- id: K19
  claim: "Replies between mutual followers get boosted"
  verdict: partially_supported
  explanation: >-
    A bidirectional-follow boost exists (default +15 on the reply weight), but it
    applies to original posts from authors the viewer mutually follows, raising the
    weight on the predicted probability that the viewer replies. Replies and
    reposts are explicitly excluded from eligibility.
  evidence:
    - path: xai-value-model/inputs.rs
      lines: [19, 23]
      anchor: "!self.is_reply && !self.is_retweet && self.is_mutual_follow_author"
      note: Only original posts from mutual-follow authors are eligible.
    - path: home-mixer/params/param.rs
      lines: [347, 352]
      anchor: '"rust_home_mixer_bidirectional_follow_reply_weight_boost",'
      note: Boost default 15.0.
    - path: docs/BIDIRECTIONAL_BOOST_CHANGE.md
      lines: [5, 5]
      anchor: "boosts original posts from people you mutually follow"
      note: Repo doc describing the July 2026 change.

- id: K20
  claim: "Profile clicks are a major ranking signal"
  verdict: contradicted
  explanation: >-
    ProfileClickWeight defaults to 0.0 and profile-visit seconds are weighted 0.0
    (home-mixer hard-codes it to 0.0), so predicted profile clicks do not add to the
    published weighted score at defaults. Experiments could set non-zero values.
  evidence:
    - path: home-mixer/params/param.rs
      lines: [374, 379]
      anchor: '"rust_home_mixer_profile_click_weight",'
      note: Profile click weight default 0.0.
    - path: home-mixer/scorers/value_model.rs
      lines: [38, 40]
      anchor: "profile_visit_secs: 0.0,"
      note: Profile visit seconds weight fixed at 0.0 in home-mixer.

- id: K21
  claim: "Out-of-network posts are down-weighted"
  verdict: supported
  explanation: >-
    Out-of-network candidates (and, by default, in-network replies and reposts) are
    multiplied by effective_oon_weight, which defaults to OonWeightFactor 0.75 (0.5
    for topic requests). Out-of-network posts also face extra visibility drop rules.
  evidence:
    - path: xai-value-model/scoring.rs
      lines: [206, 215]
      anchor: "Some(false) => true,"
      note: OON candidates get the OON multiplier.
    - path: vm-ranker/params.rs
      lines: [211, 216]
      anchor: '"rust_home_mixer_oon_weight_factor",'
      note: Default factor 0.75.

- id: K22
  claim: "Posting too often cannibalises your own reach"
  verdict: partially_supported
  explanation: >-
    Within one viewer's feed, repeated posts by the same author are discounted
    (author diversity) and only one post per conversation is kept, so several
    simultaneous posts compete with each other for that viewer. Nothing in the code
    penalises posting frequency globally or across viewers.
  evidence:
    - path: xai-value-model/scoring.rs
      lines: [183, 185]
      anchor: "(1.0 - floor) * decay_factor.powf(exponent) + floor"
      note: Same-author discount within a request.
    - path: home-mixer/filters/dedup_conversation_filter.rs
      lines: [19, 36]
      anchor: "if score > *best_score {"
      note: One post per conversation per feed.

- id: K23
  claim: "Mass blocking/reporting by bad actors suppresses an account's reach"
  verdict: unverifiable
  explanation: >-
    For ranking, the code comment states that weights apply to each viewer's
    predicted probabilities and that only actions on posts served in Home Timeline
    count, so coordinated reports mainly affect similar users. However, Agatha
    computes account-level blocks-per-fav and reports-per-fav rates that feed
    account models, and the thresholds turning those into labels are not published.
  evidence:
    - path: home-mixer/params/param.rs
      lines: [332, 344]
      anchor: "mass blocking/reporting will significantly suppress reach. There"
      note: Developers' stated reasons this has limited ranking impact.
    - path: agatha/scalding/labels/rate_based_labels/RateBasedLabels.scala
      lines: [80, 90]
      anchor: "BlocksPerFav.labelName)"
      note: Blocks and reports are aggregated into account-level rates.
