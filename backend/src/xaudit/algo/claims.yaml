  verdict: not_found_in_repo
  explanation: >-
    Grox runs LLM/VLM classifiers for safety, spam, reply spam and a "banger" screen,
    but no sentiment score or sentiment term appears in the ranking formula, and
    Grox flows are gated (e.g. multimodal embedding uses an adaptive minimum like
    count starting at 20,000). Prompts are withheld, so the exact criteria cannot be
    checked.
  evidence:
    - path: grox/flows/ptos/prompts.py
      lines: [11, 11]
      anchor: "prompts are excluded to reduce gameability of the system"
      note: Classifier criteria are not public.
    - path: grox/flows/mm_emb/adaptive_min_fav.py
      lines: [6, 19]
      anchor: "start: int = 20_000,"
      note: At least one Grox flow only processes posts above a like threshold.
  searched: "rg -n -i sentiment grox home-mixer vm-ranker xai-value-model (no matches)"

