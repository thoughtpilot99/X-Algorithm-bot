- id: K10
  claim: "A good click / dwell (2+ minutes) is worth 10-11x a like"
  verdict: contradicted
  explanation: >-
    Current defaults are ClickWeight 0.3, DwellWeight 0.05, ContDwellTimeWeight
    0.006 and ContClickDwellTimeWeight 0.4 (per unit of predicted dwell time); there
    is no "good click" head with weight 10-11. The figure appears to come from the
    2023 heavy ranker, not this code.
  evidence:
    - path: home-mixer/params/param.rs
      lines: [372, 372]
      anchor: 'param!(ClickWeight, f64, "rust_home_mixer_click_weight", 0.3);'
      note: Current click weight.
    - path: home-mixer/params/param.rs
      lines: [432, 437]
      anchor: '"rust_home_mixer_cont_click_dwell_time_weight",'
      note: Continuous click-dwell-time weight (default 0.4).

- id: K11
  claim: "Scores decay with a 6-hour half-life"
  verdict: contradicted
  explanation: >-
    The published weighted score has no time-decay term; freshness is enforced by a
    hard 48-hour age cutoff. The only half-life found in home-mixer is 8 hours, used to
    normalise views in the popular-posts retrieval source, not to decay ranking
    scores. Recency could still be learned implicitly by the prediction model.
  evidence:
    - path: xai-value-model/scoring.rs
      lines: [69, 140]
      anchor: "apply(scores.favorite_score, weights.favorite),"
      note: Weighted sum of heads with no age term.
    - path: home-mixer/params/config.rs
      lines: [40, 40]
      anchor: "pub const MAX_POST_AGE: u64 = 48 * 60 * 60;"
      note: Hard 48h cutoff.
    - path: home-mixer/util/popular_posts.rs
      lines: [36, 46]
      anchor: "half_life_hours: 8.0,"
      note: 8h half-life only in popular-posts selection.

- id: K12
  claim: "The first 30 minutes decide a post's distribution"
  verdict: not_found_in_repo
  explanation: >-
    No 30-minute decision window exists in the ranking code. Related time windows
    are the cold-start lift for posts under 7,200 s old with fewer than 200 home
    impressions, a 0.5-hour age floor in popular-posts view normalisation, and the
    48-hour age cutoff. Absence here is not proof of absence in production.
  evidence:
    - path: home-mixer/params/param.rs
      lines: [562, 567]
      anchor: '"rust_home_mixer_cold_start_max_post_age_secs",'
      note: Cold-start eligibility lasts up to 7,200 s by default.
    - path: home-mixer/util/popular_posts.rs
      lines: [36, 46]
      anchor: "floor_hours: 0.5,"
      note: 0.5h is only an age floor in a views-velocity formula.
  searched: "rg -n '30 \\* 60|1800' home-mixer vm-ranker xai-value-model"

- id: K13
  claim: "An Author Diversity Scorer throttles accounts that post frequently"
  verdict: partially_supported
  explanation: >-
    An author-diversity multiplier exists, but it applies within a single viewer's
    candidate set: the k-th additional post from the same author is multiplied by
    0.75 * 0.5^k + 0.25. It does not count how often an account posts overall.
  evidence:
    - path: xai-value-model/scoring.rs
      lines: [183, 204]
      anchor: "(1.0 - floor) * decay_factor.powf(exponent) + floor"
      note: Per-request decay by author repetition.
    - path: vm-ranker/params.rs
      lines: [175, 186]
      anchor: '"rust_home_mixer_author_diversity_floor",'
      note: Defaults decay 0.5, floor 0.25.

- id: K14
