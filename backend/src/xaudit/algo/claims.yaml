# Common public claims about the X algorithm, checked against
# x-algorithm @ 07d159b69109f069c85f84d39dd38e38adc040f0.
# "not_found_in_repo" means absent from this public code only; it is not proof
# that the behaviour is absent in production. Parameter values cited are code
# defaults; the README (lines 418) says param.rs defaults are synced to primary
# production values by cron, but experiments can differ.

- id: K01
  claim: "X uses a TweepCred-style reputation score for accounts"
  verdict: partially_supported
  explanation: >-
    There is no "TweepCred" in this repo, but user-cred-v2 computes a PageRank-based
    per-account score (0-100) from follow edges, with premium accounts and
    like/repost engagement in the teleport set. In this code the score is consumed by
    spam/abuse systems as an exemption threshold, not by the For You value model.
  evidence:
    - path: user-cred-v2/UserCredV2.scala
      lines: [9, 20]
      anchor: "else ScoreIntercept + ScoreSlope * scala.math.log(mass)"
      note: Score is a log transform of PageRank mass clamped to 0-100.
    - path: botmaker-rules/scarecrow/derived-feature/IsHighPageRankUser.df
      lines: [1, 28]
      anchor: "Coalesce(:userCredScore, -1) >= HighPageRankThreshold"
      note: Scarecrow uses the score as a high-PageRank exemption.
    - path: xai-value-model/inputs.rs
      lines: [3, 17]
      anchor: "pub struct CandidateScoringInputs {"
      note: Value-model inputs contain no cred or reputation field.
  searched: "rg -i tweepcred (no matches); rg -n -i 'cred|page_?rank' home-mixer vm-ranker xai-value-model (no ranking use)"

- id: K02
  claim: "TweepCred below 65 limits an account to 3 tweets being considered"
  verdict: not_found_in_repo
  explanation: >-
    No TweepCred, no threshold of 65, and no per-author cap of 3 tweets were found in
    the published ranking code. The user-cred thresholds visible here are 54 (scarecrow
    high-PageRank), 50.0 (abuse-enforcement skip) and 66 (Grox reply-label
    exemption), and they gate spam labelling, not tweet counts. Absence here does not
    prove absence in production.
  evidence:
    - path: abuse-enforcement-service/service-lib/rules/enforcement_user.yaml
      lines: [32, 38]
      anchor: "|| cred.score >= 50.0"
      note: Cred threshold used to skip enforcement, not to cap tweets.
    - path: grox/flows/reply_spam/constants.py
      lines: [9, 9]
      anchor: "RISKY_HIGH_VIZ_REPLY_EXEMPT_MIN_PAGE_RANK_SCORE = 66"
      note: Cred threshold exempting authors from a reply label.
  searched: "rg -i tweepcred; rg -n '\\b65\\b' home-mixer vm-ranker xai-value-model"

- id: K03
  claim: "Posts with external links get a 30-50% reach penalty"
  verdict: not_found_in_repo
  explanation: >-
    The published weighted score has no link-penalty term; open_link is a positive
    head (weight 0.2). A has_url content feature exists only in an experimental
    debias payload that is off by default and is not read by the published value
    model. Link-specific effects could still arise from model predictions or
    URL-quality spam rules, which this does not rule out.
  evidence:
    - path: home-mixer/params/param.rs
      lines: [373, 373]
      anchor: 'param!(OpenLinkWeight, f64, "rust_home_mixer_open_link_weight", 0.2);'
      note: Predicted link opens carry a positive weight.
    - path: home-mixer/params/param.rs
      lines: [502, 507]
      anchor: '"rust_home_mixer_vm_ranker_send_debias_inputs",'
      note: Debias inputs (which include has_url) default to false.
    - path: home-mixer/models/content_features.rs
      lines: [8, 20]
      anchor: "has_url: text.external_urls > 0,"
      note: has_url is only a content feature for the debias payload.
  searched: "rg -n -i 'has_url|link|url' home-mixer/scorers xai-value-model vm-ranker"

- id: K04
  claim: "Using 3 or more hashtags gets a post penalised"
  verdict: not_found_in_repo
  explanation: >-
    No hashtag count or hashtag penalty appears in home-mixer, vm-ranker or
    xai-value-model; hashtags appear only in SimClusters entity extraction, muted
    keyword handling, ads tests and Agatha data loaders. This is absent from the
    public ranking code, not proven absent in production.
  evidence: []
  searched: "rg -i -l hashtag home-mixer vm-ranker xai-value-model (only filters/viewer_muted_keyword_filter.rs and an ads test)"

- id: K05
  claim: "Premium/verified accounts get a 4x in-network and 2x out-of-network boost"
  verdict: not_found_in_repo
  explanation: >-
    No verification or premium multiplier appears in the For You scoring code; the
    only post-fusion multipliers are author diversity and the out-of-network factor.
    Premium status does appear in user-cred-v2 as the uniform teleport set, and
    gray/grey-badge status exempts accounts from some spam labels, which are
    indirect effects, not a ranking boost.
  evidence:
    - path: xai-value-model/scoring.rs
      lines: [12, 26]
      anchor: "score * self.author_diversity * self.oon"
      note: Only author-diversity and OON multipliers are applied.
    - path: user-cred-v2/UserCredV2App.scala
      lines: [173, 175]
      anchor: "validUserInfoPipe.filter(u => !u.isNearZero && u.isPremium)"
      note: Premium accounts seed user-cred PageRank, which ranking does not read.
  searched: "rg -n -i 'premium|blue_verified|is_verified|verified' home-mixer vm-ranker xai-value-model --glob '*.rs'"

- id: K06
  claim: "One report cancels out 468 likes"
  verdict: contradicted
  explanation: >-
    The ratio comes from ReportWeight -234 vs a favorite weight of 0.5, but the
    weights multiply each viewer's predicted probabilities, not raw counts, and the
    code comment explicitly calls this reading incorrect. The current home-mixer
    favorite default is 0.66, so even the ratio differs by file.
  evidence:
    - path: home-mixer/params/param.rs
      lines: [320, 330]
      anchor: "one report cancels 468 likes"
      note: Code comment rejects the count-equivalence interpretation.
    - path: home-mixer/params/param.rs
      lines: [457, 457]
      anchor: 'param!(ReportWeight, f64, "rust_home_mixer_report_weight", -234.0);'
      note: Report weight applies to P(report).

- id: K07
  claim: "Replies are worth 27x a like"
  verdict: contradicted
  explanation: >-
    Current defaults are ReplyWeight 5.0 and FavoriteWeight 0.66 in home-mixer (0.5
    in vm-ranker), i.e. roughly 7.6x-10x, and they weight predicted probabilities
    rather than counts. The 27x figure may describe the 2023 heavy ranker, which is
    not in this repo.
  evidence:
    - path: home-mixer/params/param.rs
      lines: [345, 346]
      anchor: 'param!(ReplyWeight, f64, "rust_home_mixer_reply_weight", 5.0);'
      note: Current reply and favorite default weights.
    - path: vm-ranker/params.rs
      lines: [3, 4]
      anchor: 'param!(FavoriteWeight, f64, "rust_home_mixer_favorite_weight", 0.5);'
      note: vm-ranker default favorite weight differs from home-mixer.

