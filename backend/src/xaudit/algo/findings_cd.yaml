- id: C16
  area: C
  title: Visibility-filtering verdicts are Withheld (Drop/Tombstone) or Shown with notices
  mechanism: >-
    The visibility-filtering service returns either Withheld (Drop or Tombstone)
    or Shown with optional notice (soft intervention, appealable notice, label
    interstitial), media restriction and limited-engagement parts. Per the
    README, the first rule that answers drop ends evaluation.
  path: visibility-filtering/models/verdict.rs
  lines: [8, 26]
  symbol: Verdict, Notice
  anchor: "Withheld(Decided<Withholding>),"
  status: verified
  relevance: >-
    Only drop-type outcomes remove a post from For You in home-mixer (see D13);
    notices and interstitials change presentation, not eligibility, in the
    code read here.
  observable_proxy: "Partial: interstitials/notices are visible on public posts; drops are not observable from public data."
  limitations: >-
    The mapping from Verdict to the client Action enum used by home-mixer
    (Allow, Interstitial, Avoid, Downrank, Drop, Tombstone, NotEvaluated) was
    not fully traced.

- id: C17
  area: C
  title: Extra drop rules for out-of-network recommendations; README cites missing registry.rs
  mechanism: >-
    Home-mixer evaluates in-network posts at safety level TimelineHome and
    out-of-network posts (plus ancestors and quotes) at
    TimelineHomeRecommendations. The recommendations level adds author-label
    drops (NSFW labels, SpamHighRecall, Compromised, ReadOnly, Impersonation,
    AbusiveHighRecall, DoNotAmplify) and post-label drops (DMCA, NSFW, SoftNsfw
    for new users, DoNotAmplify, MaliciousUrl, SpamHighRecall, abuse insults).
    The README says these lists live in visibility-filtering/rules/registry.rs,
    which does not exist; they are in rules/levels.rs.
  path: visibility-filtering/rules/levels.rs
  lines: [142, 213]
  symbol: TIMELINE_HOME_RECOMMENDATIONS
  anchor: "&DO_NOT_AMPLIFY_USER_LABEL_DROP_UNSPECIFIED,"
  status: verified
  relevance: >-
    An account or post carrying one of these labels would plausibly lose
    out-of-network For You distribution while remaining visible to followers in
    their home timeline. DoNotAmplify user label applies to non-followers only.
  observable_proxy: "none — not observable from public data (labels visible only to the account via the Under the Hood tool, per README)"
  limitations: >-
    README.md line 408 links to rules/registry.rs, which is absent at this
    commit. Rule definitions are in rules/tweet_rules.rs and rules/author_rules.rs.

- id: C18
  area: C
  title: safety-label-user-agg promotes repeated post labels to account labels
  mechanism: >-
    A config-driven Strato library aggregates post safety labels into user
    labels. The default config includes, for example, applying the
    NSFW_HIGH_PRECISION user label for 7 days when at least 3 of the account's
    last 5 posts within 60 days carry NSFW_HIGH_PRECISION. Rules can exclude
    high-PageRank or grey-badge accounts.
  path: safety-label-user-agg/postToUserLabelRules.strato
  lines: [395, 426]
  symbol: defaultRulesJson (nsfw_high_precision)
  anchor: '"applyUserLabel": "NSFW_HIGH_PRECISION",'
  params: [windowSize, minimumMatchingPosts, maxPostAgeDays, userLabelTtlDays]
  status: verified
  relevance: >-
    Repeated labelled posts can escalate to an account label; NSFW user labels
    are drop rules for out-of-network recommendations (C17), affecting all of
    the account's posts while the label lasts.
  observable_proxy: "Partial: whether recent posts contain adult media is publicly visible; the labels are not."
  limitations: >-
    The live rules come from feature switch safety_understanding_post_to_user_label_rules
    (line 430-432); the default JSON may not match production.

- id: C19
  area: C
  title: Legal and local-law takedowns drop posts in the request country
  mechanism: >-
    Visibility rules drop a post for non-authors when it has a legal or
    local-laws takedown in the viewer's request country. The tweet entity
    service merges a post's own takedown reasons with its author's account-level
    takedown reasons, so an account-level takedown applies to its posts.
  path: visibility-filtering/rules/tweet_rules.rs
  lines: [231, 243]
  symbol: LEGAL_TAKEDOWN_DROP_UNSPECIFIED, LOCAL_LAWS_TAKEDOWN_DROP_UNSPECIFIED
  anchor: "when: all![TweetLegalTakedownInRequestCountry],"
  status: verified
  relevance: >-
    Reach in specific countries can be zero for withheld posts or accounts,
    regardless of engagement. This is country-specific, not global.
  observable_proxy: "Partial: country-withheld notices are sometimes visible publicly; README says Under the Hood reports show such withholding to the account."
  limitations: >-
    See takedowns/tweet-entity-service/TakedownReasonsTransform.scala for the
    merge; how takedowns are decided is out of scope of the code.

- id: C20
  area: C
  title: Adult-content scoring combines media models with account-level scores
  mechanism: >-
    The experimental pNSFW media model concatenates a CLIP image score with
