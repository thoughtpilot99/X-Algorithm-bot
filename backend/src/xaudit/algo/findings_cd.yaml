  path: pnsfwmedia/model_experimental.py
  lines: [50, 60]
  symbol: _get_final_feature_tensor
  anchor: "user_health_scores.agatha_calibrated_nsfw_score"
  status: verified
  relevance: >-
    An account's history (its own NSFW score and its audience) can influence
    how its media is classified, and NSFW flags restrict out-of-network
    recommendation (C17, D01).
  observable_proxy: "Partial: posted media is public; account-level scores are not."
  limitations: >-
    The file is named "experimental"; whether it serves production is not stated.
    adult-content/ holds training and calibration code only.

# ---------------------------------------------------------------- AREA D ----

- id: D01
  area: D
  title: Pre-scoring filter order in the Phoenix For You pipeline
  mechanism: >-
    Before scoring, candidates pass in order through DropDuplicates,
    ZeroFavCodivert, CoreDataHydration, NewUserSoftNsfw, Age, SelfTweet,
    OONRetweetReply, OONNsfwSimclusters, RetweetDeduplication,
    IneligibleSubscription, PreviouslySeenPosts, PreviouslySeenPostsBackup,
    PreviouslyServedPosts, ViewerMutedKeyword, AuthorSocialgraph,
    Brazil2026Election, Video, TopicIds, NewUserMinEngagement, InventoryHoldout,
    FavHoldout and FairShareRanking. Several are switched off by default params.
  path: home-mixer/candidate_pipeline/phoenix_candidate_pipeline.rs
  lines: [419, 453]
  symbol: PhoenixCandidatePipeline filters
  anchor: "Box::new(AgeFilter::new(Duration::from_secs(params::MAX_POST_AGE))),"
  status: verified
  relevance: >-
    A post must survive all of these to be scored at all; most are viewer-
    specific (seen, muted, blocked), so failing one for one viewer does not
    affect other viewers.
  observable_proxy: "Partial: post age, reply/repost type and author are public; viewer-side state is not."
  limitations: >-
    The README table (README.md lines 370-390) omits ZeroFavCodivert,
    NewUserSoftNsfw and FairShareRanking; the code is the authority. Holdout and
    new-user filters default to false in home-mixer/params/param.rs.

- id: D02
  area: D
  title: 48-hour maximum post age for For You candidates
  mechanism: >-
    AgeFilter removes candidates whose snowflake-derived age exceeds
    MAX_POST_AGE = 48 hours; candidates with undeterminable age are also
    removed. TweetMixerSource applies the same 48-hour cut, and Thunder's
    in-memory in-network post store defaults to 172,800 s (2 days) retention.
  path: home-mixer/params/config.rs
  lines: [40, 40]
  symbol: MAX_POST_AGE
  anchor: "pub const MAX_POST_AGE: u64 = 48 * 60 * 60;"
  params: [MAX_POST_AGE]
  status: verified
  relevance: >-
    A post plausibly stops receiving For You distribution through this pipeline
    after 48 hours, regardless of performance.
  observable_proxy: "Post created_at timestamps are public; impressions per hour after 48h can be compared if available."
  limitations: >-
    Other surfaces (search, profile, notifications, conversation views) are not
    governed by this filter. Thunder retention is a CLI default (thunder/args.rs).

- id: D03
  area: D
  title: SelfTweetFilter removes the viewer's own posts
  mechanism: >-
    Candidates authored by the requesting viewer are removed from that viewer's
    For You candidate set.
  path: home-mixer/filters/self_tweet_filter.rs
  lines: [7, 20]
  symbol: SelfTweetFilter
  anchor: ".partition(|c| c.author_id != viewer_id);"
  status: verified
  relevance: >-
    No effect on an account's reach to others; it only means an author never
    sees their own post in their own For You feed from this pipeline.
  observable_proxy: "none — not observable from public data"
  limitations: "None material."

- id: D04
  area: D
  title: Out-of-network reposts and replies are filtered out
  mechanism: >-
    Reposts from accounts the viewer does not follow are removed, as are
    out-of-network replies unless EnablePhoenixOonReplies is on and the reply
    came from Phoenix retrieval (optionally only replies to the root). Any reply
    whose ancestors failed to hydrate is removed regardless of network.
  path: home-mixer/filters/oon_retweet_reply_filter.rs
  lines: [15, 28]
  symbol: OONRetweetReplyFilter
  anchor: "(c.in_network == Some(false) && (is_retweet || oon_reply_dropped))"
  params: [EnablePhoenixOonReplies, PhoenixOonRepliesRootOnly]
  status: verified
  relevance: >-
    Replies and reposts mostly reach For You only for the author's followers;
    with EnablePhoenixOonReplies defaulting to false, an account's replies are
    unlikely to be recommended to non-followers through this pipeline.
  observable_proxy: "Post type (reply / repost / original) is public; compare impressions by type."
  limitations: >-
    EnablePhoenixOonReplies default (false) is from home-mixer/params/param.rs;
    experiments can enable it for some viewers.

- id: D05
  area: D
  title: Previously seen and previously served posts are removed
  mechanism: >-
    PreviouslySeenPostsFilter drops a candidate if it, or a related post id
    (the reposted post or the parent it replies to), is in the viewer's seen ids or impression
    bloom filters. PreviouslyServedPostsFilter drops ones already served in the
    session (enabled for all requests by default via EnableServedFilterAllRequests).
  path: home-mixer/filters/previously_seen_posts_filter.rs
  lines: [16, 31]
  symbol: PreviouslySeenPostsFilter, PreviouslyServedPostsFilter
  anchor: "seen_ids.contains(&post_id)"
  params: [EnableServedFilterAllRequests]
  status: verified
  relevance: >-
    A post is generally shown to a given viewer once in For You; repeat
    impressions to the same viewer are not expected from this pipeline. Bloom
    filters can have false positives, so a small share of unseen posts may be
    dropped.
  observable_proxy: "none — not observable from public data"
  limitations: >-
    Bloom-filter sizes and false-positive rates come from request data, not code.

- id: D06
  area: D
  title: AuthorSocialgraphFilter removes blocked/muted authors in either direction
  mechanism: >-
    Candidates are removed when the viewer mutes or blocks the author, the
    author blocks the viewer, the quoted author blocks the viewer, or the viewer
    blocks the quoted or reposted author.
  path: home-mixer/filters/author_socialgraph_filter.rs
  lines: [27, 56]
  symbol: AuthorSocialgraphFilter
  anchor: "let author_blocks_viewer = candidate.author_blocks_viewer.unwrap_or(false);"
  status: verified
  relevance: >-
    Each block or mute removes that one viewer from the author's For You
    audience; quoting or reposting an account a viewer blocks also hides the
    quote/repost from that viewer.
  observable_proxy: "none — not observable from public data"
  limitations: "Block/mute lists are private."

- id: D07
  area: D
  title: Duplicate posts and repeated reposts collapse to one candidate
  mechanism: >-
    DropDuplicatesFilter keeps the first copy of a tweet id returned by several
    sources (merging retrieval sources). RetweetDeduplicationFilter keys
    candidates on the reposted id (or own id) and keeps only the first, so an
    original and its reposts collapse to whichever arrived first.
  path: home-mixer/filters/retweet_deduplication_filter.rs
  lines: [19, 30]
  symbol: RetweetDeduplicationFilter, DropDuplicatesFilter
  anchor: "let dedup_id = candidate.retweeted_tweet_id.unwrap_or(candidate.tweet_id);"
  status: verified
  relevance: >-
    Many followers reposting the same post do not create multiple slots for it
    in one viewer's feed.
  observable_proxy: "Repost counts are public, but how many reached a given viewer is not."
  limitations: "Ordering of candidates before the filter decides which copy survives."

- id: D08
  area: D
  title: DedupConversationFilter keeps one post per conversation (highest score)
  mechanism: >-
    After selection, candidates are grouped by conversation (the smallest
    ancestor id, or the original post id) and only the highest-scoring
    candidate per conversation is kept.
  path: home-mixer/filters/dedup_conversation_filter.rs
  lines: [19, 49]
  symbol: DedupConversationFilter
  anchor: "if score > *best_score {"
  status: verified
  relevance: >-
    An author's self-reply thread or several replies in the same conversation
    compete for one slot per viewer feed request.
  observable_proxy: "Conversation ids and reply structure are public."
  limitations: "Applies per feed response; other surfaces are not covered."

- id: D09
  area: D
  title: Author diversity multiplier decays repeated authors within one feed
  mechanism: >-
    Candidates are ordered by score; the k-th additional post from the same
    author in that request (k = 0 for the first) is multiplied by
    (1 - floor) * decay^k + floor. With defaults decay 0.5 and floor 0.25 this
    gives 1.0, 0.625, 0.4375, ... approaching 0.25.
  path: xai-value-model/scoring.rs
  lines: [183, 204]
  symbol: diversity_multiplier, author_pool_counts
  anchor: "(1.0 - floor) * decay_factor.powf(exponent) + floor"
  params: [EnableAuthorDiversity, AuthorDiversityDecay, AuthorDiversityFloor]
  status: verified
  relevance: >-
    Several posts by the same author competing for one viewer's feed are
    progressively discounted; this is per viewer per request, not a global
    penalty on posting frequency.
  observable_proxy: "Posting frequency is public; whether several posts reach the same viewer at once is not."
  limitations: >-
    Defaults are in vm-ranker/params.rs (lines 169-186). Home-mixer's local
    fallback scoring disables author diversity (home-mixer/scorers/value_model.rs).

- id: D10
  area: D
  title: Out-of-network discount (OonWeightFactor 0.75), also for in-network replies/reposts
  mechanism: >-
    The OON multiplier applies to out-of-network candidates and, when
    EnableOonRescoreForInNetworkRepliesRetweets is true (default), to in-network
    replies and reposts. The multiplier is the request's effective_oon_weight:
    OonWeightFactor (0.75) normally, TopicOonWeightFactor (0.5) for topic
    requests, or NewUserOonWeightFactor for eligible new viewers.
  path: xai-value-model/scoring.rs
  lines: [206, 251]
  symbol: oon_applies, post_fusion_multipliers
  anchor: "weights.oon_rescore_in_network_replies_retweets"
  params: [OonWeightFactor, TopicOonWeightFactor, NewUserOonWeightFactor, EnableOonRescoreForInNetworkRepliesRetweets]
  status: verified
  relevance: >-
    Reaching non-followers carries a 25% score discount at defaults, so
    out-of-network posts need higher predicted engagement to rank equally.
  observable_proxy: "Partial: follower vs non-follower impressions are not public; follower count gives the in-network ceiling."
  limitations: >-
    Defaults from vm-ranker/params.rs lines 205-228; production values can
    differ per experiment bucket.

- id: D11
  area: D
  title: New-viewer OON factor exists but default age threshold is 0
  mechanism: >-
    For a viewer younger than NewUserAgeThresholdSecs who follows at least 5
    accounts, effective_oon_weight is NewUserOonWeightFactor (default 0.00001),
    almost eliminating out-of-network posts. With the default threshold of 0
    seconds, no viewer qualifies, so the branch is inactive unless configured.
  path: vm-ranker/scoring/value_model.rs
  lines: [118, 142]
  symbol: scoring_context
  anchor: ".is_some_and(|age| age < params.get(NewUserAgeThresholdSecs))"
  params: [NewUserAgeThresholdSecs, NewUserOonWeightFactor]
  status: verified
  relevance: >-
    If enabled in production, brand-new viewers would see almost only accounts
    they follow, reducing out-of-network reach to new users.
  observable_proxy: "none — not observable from public data"
  limitations: "Whether production sets a non-zero threshold is unknown."

- id: D12
  area: D
  title: DPP diversity rerank zeroes non-selected candidates
  mechanism: >-
    vm-ranker takes the top DppMaxSelectedRank (150) candidates by score and
    greedily selects a subset maximising a determinant over a kernel combining
    score (scaled by theta 0.65) with cosine similarity of multimodal post
    embeddings. Selected posts keep their score; non-selected posts get score
    0. Posts with missing embeddings get a random unit vector.
  path: vm-ranker/scoring/dpp_model.rs
  lines: [196, 207]
  symbol: rank_with_memo, dpp::rescore
  anchor: "if selected_ids.contains(&c.tweet_id) {"
  params: [DppEnabled, DppTheta, DppMaxSelectedRank]
  status: verified
  relevance: >-
    A post that is semantically similar to higher-scored posts in the same
    viewer's candidate set can be dropped from the slate even with a good score.
  observable_proxy: "Partial: post content is public; the embedding and competing candidates are not."
  limitations: >-
    Params default in vm-ranker/params.rs (DppEnabled true, theta 0.65, max rank
    150); CLI defaults in vm-ranker/args.rs differ (dpp_enabled false, theta
    0.5, top_k 50). The final top_k used in production is not shown.

- id: D13
  area: D
  title: VFFilter drops only Drop/Tombstone/NotEvaluated; Downrank/Avoid kept
  mechanism: >-
    After selection, VFFilter removes candidates whose visibility action is
    Drop, Tombstone or NotEvaluated. Allow, Interstitial, Avoid and Downrank are
    kept, and no other home-mixer code was found that changes scores based on
    Avoid or Downrank.
  path: home-mixer/filters/vf_filter.rs
  lines: [22, 27]
  symbol: should_drop_action
  anchor: "Action::Drop(_) | Action::Tombstone | Action::NotEvaluated => true,"
  status: verified
  relevance: >-
    Visibility filtering affects For You reach mainly by dropping posts. A post
    whose VF lookup failed (NotEvaluated) would also be dropped.
  observable_proxy: "none — not observable from public data"
  limitations: >-
    The absence of Downrank/Avoid handling is from a search of home-mixer only;
    other services could use them.

- id: D14
  area: D
  title: Post-selection AncillaryVF, AncestorVideo and VideoCarousel filters
  mechanism: >-
    AncillaryVFFilter drops a candidate flagged drop_ancillary_posts, which the
    VF hydrator sets when any non-tombstoned ancestor or the quoted post has a
    drop-type visibility action. Ancestors and quoted posts are always evaluated
    at the out-of-network safety level (TimelineHomeRecommendations), even for
    in-network candidates. AncestorVideoFilter drops posts whose ancestor has
    video when the request excludes video; VideoCarouselFilter runs last and
    splits candidates for a video carousel.
  path: home-mixer/candidate_hydrators/vf_candidate_hydrator.rs
  lines: [140, 160]
  symbol: should_drop_ancillary, AncillaryVFFilter, AncestorVideoFilter, VideoCarouselFilter
  anchor: "if let Some(quoted_id) = candidate.quoted_tweet_id"
  status: verified
  relevance: >-
    Replying to or quoting a post that carries out-of-network drop labels can
    make the reply or quote ineligible for For You, even for the author's own
    followers.
  observable_proxy: "Partial: quoted/parent posts are public; their visibility labels are not."
  limitations: >-
    Filter in home-mixer/filters/ancillary_vf_filter.rs; the level assignment is
    in vf_candidate_hydrator.rs lines 70-85. Tombstone handling of ancestors was
    not traced in detail.

- id: D15
  area: D
  title: No time-decay term in the weighted score
  mechanism: >-
    The weighted score is a sum of head predictions times weights (favorite,
    reply, repost, clicks, dwell, shares, follow, negative feedback, etc.); none
    of the terms is a function of post age. Freshness is enforced by hard
    cutoffs (48h AgeFilter, D02) and by whatever the prediction model learns.
  path: xai-value-model/scoring.rs
  lines: [69, 140]
  symbol: compute_weighted_score
  anchor: "apply(scores.favorite_score, weights.favorite),"
  status: verified
  relevance: >-
    There is no explicit half-life multiplier on the final score in this code.
    Recency can still matter if the Phoenix model's predictions depend on post
    age, which this finding does not establish.
  observable_proxy: "Post timestamps are public."
  limitations: >-
    Phoenix model inputs were not audited for age features. Cold-start lift
    (D19) has its own age cap.

- id: D16
  area: D
  title: Popular-posts retrieval normalises views with an 8-hour half-life
  mechanism: >-
    A separate PopularPostsSource (enabled by default) selects up to 500 posts
    from the last 24 hours, at most 5 per author, by a quality score that
    divides views by an exponential saturation curve with an 8-hour half-life
    and a 0.5-hour age floor, i.e. favouring view velocity.
  path: home-mixer/util/popular_posts.rs
  lines: [36, 53]
  symbol: SelectionConfig, quality
  anchor: "let lambda = std::f64::consts::LN_2 / config.half_life_hours;"
  params: [half_life_hours, floor_hours, window_hours, per_author, budget, EnablePopularPostsSource]
  status: verified
  relevance: >-
    Posts that gather views quickly are more likely to enter this candidate
    pool for out-of-network viewers. This affects retrieval only; the post is
    then scored like any other candidate.
  observable_proxy: "View counts and post age are public for many posts."
  limitations: >-
    half_life_hours can be overridden by a CLI flag (home-mixer/main.rs, default 8.0).

- id: D17
  area: D
  title: Debias payload with has_url is sent to vm-ranker only when enabled (default off)
  mechanism: >-
    When VMRankerSendDebiasInputs is true and the request has no cached posts,
    home-mixer adds per-candidate content features to the vm-ranker request:
    has_video, video duration, has_photo, media count, weighted text length,
    newline count and has_url (external URLs in text). The parameter defaults
    to false, and the value model shown here does not read these fields.
  path: home-mixer/scorers/vm_ranker_request.rs
  lines: [17, 24]
  symbol: RequestShape::from_query
  anchor: "query.params.get(VMRankerSendDebiasInputs)"
  params: [VMRankerSendDebiasInputs]
  status: verified
  relevance: >-
    No URL penalty appears in the published scoring formula; has_url is only an
    experimental payload field whose use by vm-ranker is not shown.
  observable_proxy: "Presence of links in post text is public."
  limitations: >-
    Default from home-mixer/params/param.rs lines 502-507. How vm-ranker
    experiments consume experiment_payload is not in this repo.

- id: D18
  area: D
  title: Embedding-based similarity de-duplication (DPP, video carousel)
  mechanism: >-
    Content similarity is handled with embeddings rather than text matching in
    this pipeline: DPP (D12) penalises cosine-similar posts, and the video
    carousel de-duplicates by author and by embedding similarity above a 0.72
    threshold (both enabled by default).
  path: home-mixer/params/param.rs
  lines: [1165, 1175]
  symbol: EnableVideoCarouselEmbeddingDedupe, VideoCarouselEmbeddingDedupeThreshold
  anchor: '"rust_home_mixer_video_carousel_embedding_dedupe_threshold",'
  params: [EnableVideoCarouselEmbeddingDedupe, VideoCarouselEmbeddingDedupeThreshold, EnableVideoCarouselAuthorDedupe]
  status: verified
  relevance: >-
    Near-duplicate content competing for the same viewer is likely to be
    thinned out; an author's own similar posts compete with each other.
  observable_proxy: "Partial: content of posts is public; embeddings are not."
  limitations: "The embedding models are not reproduced here."

- id: D19
  area: D
  title: Cold-start lift for low-impression posts from smaller authors
  mechanism: >-
    AuthorColdStart can lift one eligible candidate per request to the score at
    a randomly chosen target rank. Eligible posts are originals (not replies or
    reposts) from authors with <= 50,000 followers, younger than 7,200 s, with
    fewer than 200 home impressions, within an allowed position range, and in
    the viewer's experiment arm's author corpus.
  path: home-mixer/scorers/author_cold_start.rs
  lines: [188, 193]
  symbol: cold_start_base_eligible, apply_cold_start
  anchor: ".is_some_and(|followers| (followers as i64) <= follower_cap)"
  params: [EnableViewerColdStart, ColdStartFollowerCap, ColdStartImpressionThreshold, ColdStartMaxPostAgeSecs]
  status: verified
  relevance: >-
    Small accounts' fresh original posts can get an exploratory boost early in
    their life; replies and reposts are not eligible.
  observable_proxy: "Follower count, post type and post age are public; home impressions are partly visible via view counts."
  limitations: >-
    Defaults from home-mixer/params/param.rs (lines 539-581); slot range and
    corpus bucketing are experiment-controlled.
