# Findings for areas C (account & content quality) and D (feed-level behaviour).
# Repo: x-algorithm @ 07d159b69109f069c85f84d39dd38e38adc040f0
# Every anchor is copied verbatim from the cited line range. "verified" means the
# behaviour is read directly from code at this commit; it does not prove that
# production runs the same code or the same parameter values.

# ---------------------------------------------------------------- AREA C ----

- id: C01
  area: C
  title: user-cred-v2 turns PageRank mass into a 0-100 score
  mechanism: >-
    user-cred-v2 is an offline Scalding job that runs PageRank and converts each
    account's resulting mass into a score of 165.2 + 7.07 * ln(mass), clamped to
    [0, 100]; zero or negative mass maps to 0. The score is logarithmic in mass,
    so large differences in mass translate into modest score differences.
  path: user-cred-v2/UserCredV2.scala
  lines: [9, 20]
  symbol: UserCredV2.fromMass
  anchor: "else ScoreIntercept + ScoreSlope * scala.math.log(mass)"
  params: [ScoreSlope, ScoreIntercept]
  status: verified
  relevance: >-
    The score is an account-level reputation number. In this repo it is used to
    exempt high-scoring accounts from some automated spam labelling (see C05,
    C06, C10, C11), not as a ranking feature in the For You value model (see C07).
  observable_proxy: "none — not observable from public data (mass depends on the whole follow graph and on non-public engagement logs)"
  limitations: >-
    Only the job is published; the output dataset and the values any given
    account receives are not. Slope/intercept are hard-coded here but production
    could run a different build.

- id: C02
  area: C
  title: user-cred-v2 PageRank defaults (jump 0.2, 50 iterations, beta 0.5)
  mechanism: >-
    Command-line defaults set the PageRank jump (teleport) probability to 0.2,
    convergence threshold 0.001, at most 50 iterations, and an engagement
    teleport blend beta of 0.5. Engagement edges are read over a 7-day window
    (EngagementWindowDays), and the run is gated on row-count and mass-sum
    sanity checks before publishing.
  path: user-cred-v2/UserCredV2Config.scala
  lines: [24, 45]
  symbol: UserCredV2Config.fromArgs
  anchor: 'args.getOrElse("jump_prob", "0.2").toDouble'
  params: [jump_prob, threshold, max_iterations, engagement_teleport_beta, vit_threshold, EngagementWindowDays]
  status: verified
  relevance: >-
    The 7-day engagement window means the engagement-driven part of an account's
    score can move week to week; the follow-graph part changes more slowly.
  observable_proxy: "none — not observable from public data"
  limitations: >-
    These are argument defaults; the production job may be launched with other
    values. vit_threshold (55.0) is read but its use is outside this file.

- id: C03
  area: C
  title: user-cred-v2 teleport set is premium/verified accounts plus engagement mass
  mechanism: >-
    The PageRank graph uses follow edges; the teleport (restart) distribution
    blends (1 - beta) x uniform mass over premium accounts (blue, gold, gray
    verified, verified organisations and their affiliates, excluding near-zero
    state accounts) with beta x engagement mass, where each engager's prior mass
    is split across the authors they liked or reposted in the window. Restricted,
    deactivated, suspended and erased accounts are dropped from the user set.
  path: user-cred-v2/UserCredV2App.scala
  lines: [141, 193]
  symbol: UserCredV2App.computeTeleportWeights
  anchor: "validUserInfoPipe.filter(u => !u.isNearZero && u.isPremium)"
  params: [engagement_teleport_beta]
  status: verified
  relevance: >-
    Being followed by, or liked/reposted by, accounts that themselves hold mass
    (premium accounts are seeded with mass) would plausibly raise an account's
    score. This affects reach only through the consumers in C05/C06/C10/C11,
    which use the score as an exemption from some spam actions.
  observable_proxy: "Partial: whether followers/engagers are verified is visible publicly; their mass is not."
  limitations: >-
    isPremium is defined in user-cred-v2/ValidUserInfo.scala. The magnitude of
    any individual account's mass cannot be reconstructed without the full graph.

- id: C04
  area: C
  title: user-cred-v2 counts only likes/reposts and drops linked-account edges
  mechanism: >-
    Engagement edges are built only from Favorite and Retweet interactions where
    the engager is not the author. Both follow and engagement edges are removed
    when the (source, destination) pair appears in an account-expansion
    investigations dataset of linked users, so edges between accounts flagged as
    linked do not transfer mass.
  path: user-cred-v2/UserCredV2App.scala
  lines: [79, 118]
  symbol: readEngagementEdges, filterLinkedUserEdges
  anchor: "if event.engagingUserId != authorUserId"
  params: [EngagementTypes]
  status: verified
  relevance: >-
    Self-engagement and engagement from accounts identified as linked to the
    author would plausibly not raise the author's score; replies, quotes and
    bookmarks are not engagement edges here.
  observable_proxy: "Partial: public like/repost counts exist, but who engaged and whether accounts are linked is not public."
  limitations: >-
    How AccountExpansionInvestigations identifies linked users is not in this repo.

- id: C05
  area: C
  title: scarecrow rules treat high user-cred (>= 54) as an exemption
  mechanism: >-
    The botmaker derived feature IsHighPageRankUser is true when the UserCredV2
    score is >= HighPageRankThreshold (54 in HighPageRankThreshold.df) or the
    account carries a PREDICTED_HIGH_PAGE_RANK label; if neither is available it
    falls back to follower count > 25,000. Many scarecrow rules (low-quality URL,
    duplicate text, Grox reply flags, NSFW labelling) require
    !IsHighPageRankUser before acting.
  path: botmaker-rules/scarecrow/derived-feature/IsHighPageRankUser.df
  lines: [1, 28]
  symbol: IsHighPageRankUser
  anchor: "val :fallbackFollowerCountCriteria = :followerCountFromGizmoduck > 25000;"
  params: [HighPageRankThreshold]
  status: verified
  relevance: >-
    Accounts below the threshold are eligible for these automated labels;
    accounts above it are skipped by the rules that check it. Being below the
    threshold does not by itself reduce reach.
  observable_proxy: "Partial: follower count (> 25,000 fallback) is public; the user-cred score and PREDICTED_HIGH_PAGE_RANK label are not."
  limitations: >-
    Some botmaker rules are withheld from the repo (README "What's not in this
    repo?"), so the full set of rules using this exemption is unknown.

- id: C06
  area: C
  title: abuse-enforcement-service skips accounts with high cred, grey badge or many followers
  mechanism: >-
    In the published user and post enforcement rule files, an account is skipped
    (no action) when cred.is_high is true (high-PageRank flag OR grey badge,
    composed in strato.rs compose_cred) or cred.score >= 50.0, and also above
    follower-count thresholds. The follower thresholds in the file are
    explicitly mock values; production uses different ones.
  path: abuse-enforcement-service/service-lib/rules/enforcement_user.yaml
  lines: [18, 38]
  symbol: very_high_follower_count, high_follower_count, pagerank_skipped
  anchor: "|| cred.score >= 50.0"
  params: [cred.score, cred.is_high, cred.follower_count]
  status: verified
  relevance: >-
    Model-driven suspensions and labels (e.g. SpamHighRecall from anchor-campaign
    scores) are not applied to accounts that clear these skips. Lower-cred,
    smaller accounts are the ones exposed to these actions.
  observable_proxy: "Partial: follower count is public but production thresholds are not; cred score is not public."
  limitations: >-
    The file is "mirrored from GrowthBook dynamic config"; production rules can
    change without a code change. Follower thresholds are mock values.

- id: C07
  area: C
  title: No user-cred input in the For You value-model scoring path
  mechanism: >-
    The per-candidate inputs to the value model are predicted engagement scores
    plus author id, in-network, reply/retweet, mutual-follow and video
    eligibility flags; there is no user-cred, PageRank or verification field. A
    search of home-mixer, vm-ranker and xai-value-model finds no reference to
    user cred or page rank. In bdsm the user_cred_norm feature is filled with zeros.
  path: xai-value-model/inputs.rs
  lines: [3, 17]
  symbol: CandidateScoringInputs
  anchor: "pub struct CandidateScoringInputs {"
  status: inferred
  relevance: >-
    In this code, the final weighted score does not appear to apply a direct
    reputation multiplier. Cred can still matter indirectly through labels whose
    application it gates (C05/C06/C10/C11), which visibility filtering can act on.
  observable_proxy: "none — not observable from public data"
  limitations: >-
    This is a negative result from searching the published code. The Phoenix
    model's own input features are not fully audited here, and a TweetEmbedding
    thrift struct in phoenix/crates/serving/xai-recsys-mm-server/src/events.rs
    carries a user_credibility field whose use was not traced.

- id: C08
  area: C
  title: Agatha rate-based labels (blocks, reports, spam reports per out-of-network fav)
  mechanism: >-
    Agatha's offline job computes per-account smoothed ratios of blocks, abuse
    reports (180-day window, AbuseTriageTool reports only), legit spam reports
    and all spam reports, each relative to out-of-network favorites received:
    (interaction + 0.1) / (interaction + favs + 0.1 / prior). These are written
    as user labels (BlocksPerFav, ReportsPerFav, SpamReportsPerFav,
    AllSpamReportsPerFav) used in downstream account models.
  path: agatha/scalding/labels/rate_based_labels/RateBasedLabels.scala
  lines: [28, 118]
  symbol: RateBasedLabels.computeScoresForInteractions, getUserLabels
  anchor: "val denominator = interaction + favs + (smoothingParam / prior)"
  params: [smoothingParam]
  status: verified
  relevance: >-
    An account that draws many blocks or reports relative to the likes it gets
    from non-followers would plausibly get a higher rate. How those rates turn
    into labels or enforcement that affect reach is not shown here.
  observable_proxy: "Partial: public like counts give a rough denominator; blocks and reports are not public."
  limitations: >-
    Thresholds and the models trained on these labels (e.g. Blink scores in
    agatha/scalding/blink) are only partly published. Blocks are taken from a
    graph snapshot filtered by update time and known-artificial users.

- id: C09
  area: C
  title: BDSM behavioural sequence model for bots/spam/coordination (thresholds redacted)
  mechanism: >-
    BDSM is a transformer over an account's recent action sequence (timing-aware
    position embeddings, action type, surface, dwell, device signals) with eight
    heads: FollowBot, LikeBot, EngagementAmplifier, ReplySpamBot, TweetSpamBot,
    RTBot, MultiActionBot and LegitimateUser. A results sink applies per-head
    thresholds and graduated actions (challenge vs suspend).
  path: bdsm/README.md
  lines: [17, 40]
  symbol: bdsm heads
  anchor: "- **Eight task heads** (`runtime/heads.py`): FollowBot, LikeBot,"
  params: [min_actions_for_enforcement, thresholds]
  status: verified
  relevance: >-
    Automation-like patterns (mechanical cadence, bursts, repetitive engagement)
    are what the model is designed to detect; an account flagged here could be
    challenged or suspended, which would plausibly remove reach entirely.
  observable_proxy: "Partial: post timestamps and posting cadence are public; likes, follows, dwell and device signals of the account are not."
  limitations: >-
    Operating points are redacted: bdsm/runtime/sink_policy.yaml ships 9.99 and
    999999 sentinels. The backing sequence store and weights are not published.

- id: C10
  area: C
  title: Grox PTOS spam verdicts apply SpamHighRecall post labels
  mechanism: >-
    When the Grox PTOS (post terms-of-service) classifier returns a Spam
    violation, the sink applies the SpamHighRecall post label. Engagement
    baiting, engagement farming and card manipulation are labelled for every
    author; other spam policy types are skipped for high-PageRank authors.
    Adult and violent-media verdicts apply NSFW/gore labels.
  path: grox/flows/ptos/task_write_safety_post_annotations_result_sink.py
  lines: [233, 248]
  symbol: TaskWriteSafetyPostAnnotationsResultSink._apply_labels_for_annotation
  anchor: "SafetyPolicyType.SpamEngagementBaiting,"
  params: [SpamEngagementBaiting, SpamEngagementFarming, SpamCardManipulation]
  status: verified
  relevance: >-
    A SpamHighRecall post label drops the post from out-of-network For You
    recommendations to non-authors (see C17), while followers can still see it.
    Engagement-bait style posts are labelled even for high-cred authors.
  observable_proxy: "Partial: post text is public, so engagement-bait phrasing can be checked heuristically; the classifier verdict is not public."
  limitations: >-
    The LLM prompts defining each policy are withheld (C12). Which posts enter
    the PTOS flow (rate limits, filters) is only partly visible.

- id: C11
  area: C
  title: Grox reply spam flags replies with RiskyHighVizReply unless high cred (>= 66)
  mechanism: >-
    The reply_spam flow scores replies; when the reply-ranking score is 0.0 it
    applies the RiskyHighVizReply post label unless the author's user-cred is >=
    66 (or the high-PageRank flag when no score), the author has a grey badge,
    or is a test user. Separately, scarecrow rule 25026 applies
    RISKY_HIGH_VIZ_REPLY for 14 days when a Grox spamScore >= 0.97, unless the
    reply is by the conversation author or the author is high-PageRank,
    skip-listed or gray verified.
  path: grox/flows/reply_spam/task_write.py
  lines: [39, 80]
  symbol: _is_label_exempt_high_page_rank, _apply_reply_spam_label
  anchor: "return info.userCredScore >= RISKY_HIGH_VIZ_REPLY_EXEMPT_MIN_PAGE_RANK_SCORE"
  params: [RISKY_HIGH_VIZ_REPLY_EXEMPT_MIN_PAGE_RANK_SCORE]
  status: verified
  relevance: >-
    Low-cred accounts that leave replies judged spammy may have those replies
    labelled; the rule name suggests a downrank of the reply, but where the
    label is consumed is not in this repo.
  observable_proxy: "Partial: an account's reply text and reply volume are public; scores and labels are not."
  limitations: >-
    The consumer of RiskyHighVizReply (e.g. conversation reply ordering) is not
    present; the effect on reach is inferred from the label name only. Prompts
    are withheld. See botmaker-rules/scarecrow/bot/GroxTweetProcessor.bot for rule 25026.

- id: C12
  area: C
  title: Grox prompts withheld; UPA "banger" screen and multimodal embeddings
  mechanism: >-
    Grox runs LLM/VLM flows on posts: ptos (safety/spam policy), reply_spam,
    upa (an initial "banger" screen and post-safety screen that send boolean
    metadata to a labelling endpoint) and mm_emb (multimodal post embeddings).
    The prompt templates (.j2) are excluded from the repo; each prompts.py says
    so in a comment.
  path: grox/flows/ptos/prompts.py
  lines: [11, 11]
  symbol: prompts.py
  anchor: "prompts are excluded to reduce gameability of the system"
  status: verified
  relevance: >-
    Grox outputs can become post labels that visibility filtering acts on, but
    the classification criteria are not public, so a specific post's risk
    cannot be predicted from code alone.
  observable_proxy: "none — not observable from public data (criteria withheld; outputs not public except via the Under the Hood label tool)"
  limitations: >-
    The README lists Grox prompts among withheld files. How UPA labels are used
    downstream (grok_upa_action_with_labels) is not shown. mm_emb gates
    embedding by an adaptive minimum fav count (grox/flows/mm_emb/adaptive_min_fav.py).

- id: C13
  area: C
  title: abuse-enforcement-service maps model labels to post/account actions
  mechanism: >-
    After the skip rules, enforcement rules map model score labels to actions,
    for example llm_slop_post -> RiskyHighVizReply post label for 30 days,
    gibberish_post and fast_reply_spam_post -> SpamHighRecall post label,
    anchor_campaign_* -> SpamHighRecall user label or suspension. The post rules
    also apply the follower/PageRank skips unless a score sets
    skip_author_credibility_prechecks.
  path: abuse-enforcement-service/service-lib/rules/enforcement_post.yaml
  lines: [39, 58]
  symbol: act_add_llm_slop_post_label, act_add_gibberish_post_label, act_add_fast_reply_spam_post_label
  anchor: "when: '\"llm_slop_post\" in score.labels'"
  params: [ttl_msec]
  status: verified
  relevance: >-
    Posts classified as low-effort generated text, gibberish or fast reply spam
    can receive labels that limit distribution (SpamHighRecall is a drop for
    out-of-network recommendations, C17).
  observable_proxy: "Partial: post text and reply timing are public; the upstream model scores are not."
  limitations: >-
    The models producing labels like llm_slop_post are not in this file and may
    not be published. The rules are a mirror of GrowthBook config and may change.

- id: C14
  area: C
  title: abuse-ledger appeal holds block re-applying overturned actions
  mechanism: >-
    abuse-ledger-service answers whether an account has an active (uncleared,
    unexpired) enforcement hold for a suspension or for specific labels. Per
    the README, when an enforcement is overturned on appeal,
    abuse-enforcement-service does not re-apply that action for a fixed period
    set per appeal queue.
  path: abuse-ledger-service/src/sql.rs
  lines: [3, 7]
  symbol: PROBE_SQL
  anchor: "cleared_at IS NULL AND expires_at > now()"
  status: verified
  relevance: >-
    A successful appeal can temporarily protect an account from the same
    automated label or suspension being re-applied.
  observable_proxy: "none — not observable from public data"
  limitations: >-
    Hold durations per queue are not in the repo. The client side in
    abuse-enforcement-service was only partly read.

- id: C15
  area: C
  title: botmaker-rules label duplicate-text replies as COPYPASTA_SPAM (some rules withheld)
  mechanism: >-
    Rule 21599 consumes scheduled BigQuery jobs that cluster replies with
    duplicate text (unigrams, or characters for CJK) and applies the
    COPYPASTA_SPAM label to each reply, skipping test users, high-PageRank
    users, a temporary skip list and gray-verified users. Some botmaker rules
    are deliberately not published.
  path: botmaker-rules/scarecrow/bot/BBQDuplicateTextRepliesProd.bot
  lines: [25, 46]
  symbol: BBQDuplicateTextRepliesProd
  anchor: 'TweetRtfApplyLabel("COPYPASTA_SPAM", :tweetId);'
  status: verified
  relevance: >-
    Posting the same or near-identical reply text repeatedly could plausibly get
    replies labelled; the rule's own note calls this a downrank, but the label's
    ranking effect is not shown in this repo.
  observable_proxy: "Account's own reply texts are public, so repeated identical replies can be counted."
  limitations: >-
    README.md line 433 lists "Some botmaker rules" as withheld. The clustering
