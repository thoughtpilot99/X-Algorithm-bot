analysis:
  # Default window per the brief; extended window used when data allows.
  default_window_days: 90
  extended_window_days: 180
  # Posts younger than this at observation time have immature view counts and
  # are excluded from baselines (they are still listed, flagged "immature").
  min_post_age_hours: 72
  # Minimum group size before a segment comparison is reported at all.
  min_segment_n: 8
  # Thresholds for "substantially above/below baseline" (multiples of rolling median).
  above_baseline_multiple: 2.0
  below_baseline_multiple: 0.5

# Commenting Effectiveness Score — an INTERNAL DIAGNOSTIC, not an X algorithm score.
# Components are scored 0..1 and combined with these user-editable weights.
comment_score_weights:
  relevance: 0.25        # parent post / author is in the client's topic cluster
  originality: 0.25      # reply category is substantive (insight, expertise, question, disagreement)
  observed_engagement: 0.20  # reply views/likes relative to the client's reply median
  conversation: 0.15     # reply drew replies (public reply_count > 0)
  timing: 0.15           # reply posted while parent is fresh (when parent time is known)

# Monitoring alerts: robust control limits on weekly median log views.
alerts:
  k: 3.0                 # band width in robust standard deviations (1.4826 * MAD)
  window_weeks: 8        # trailing weeks forming the band
  min_history_weeks: 6   # no alert until this many complete weeks exist
  mad_floor_log: 0.15    # minimum band half-width unit on log scale (avoids alerts on unusually calm history)
  abrupt_drop: 0.5       # cross-format drop vs prior 4 weeks that triggers an investigation alert
  min_posts_per_week: 3

llm:
  # Used for topic / hook / reply classification and rewrite drafting.
  # Every LLM output is cached and labelled; numbers in prose are validated.
  model: claude-sonnet-5-5
  max_tokens: 4096
